<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cellmetron Checkout</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <header class="header">
    <nav class="nav">
      <a href="index.html">Cellmetron</a>
      <a href="shop.html">Shop</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <main class="layout">
    <section class="hero hero-gradient mb-xxl">
      <h1 class="accent">Checkout</h1>
      <p>Complete your Cellmetron order.</p>
    </section>

    <section class="section">
      <h2>Your Order</h2>
      <div id="checkout-summary"></div>

      <button class="btn mt-xl" onclick="checkout()">Pay Now</button>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; BLT Company – Cellmetron</p>
  </footer>

  <script src="https://js.stripe.com/v3/"></script>
  <script src="../js/app.js"></script>
  <script src="../js/checkout.js"></script>

  <script>
    // Render cart summary
    const cart = JSON.parse(localStorage.getItem("Cellmetron_cart")) || [];
    const container = document.getElementById("checkout-summary");

    if (cart.length === 0) {
      container.innerHTML = "<p>Your cart is empty.</p>";
    } else {
      container.innerHTML = cart
        .map(item => `<div class="card mb-lg"><h3>${item.name}</h3><p>Qty: ${item.qty}</p></div>`)
        .join("");
    }
  </script>
</body>
</html>
