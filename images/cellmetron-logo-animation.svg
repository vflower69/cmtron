<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    :root {
      --cellmetron-green: #00A89E;
      --cellmetron-navy: #0A1E2E;
      --cellmetron-white: #FFFFFF;
    }

    .cmtron-root {
      cursor: pointer;
    }

    .cmtron-emblem {
      fill: var(--cellmetron-green);
      stroke: var(--cellmetron-navy);
      stroke-width: 4;
      transform-origin: 50% 40%;
      transition: transform 0.3s ease-out;
    }

    .cmtron-wordmark {
      fill: var(--cellmetron-navy);
      transition: filter 0.3s ease-out;
    }

    .cmtron-root:hover .cmtron-emblem {
      animation: cmtron-rotate 8s linear infinite;
    }

    .cmtron-root:hover .cmtron-wordmark {
      animation: cmtron-glow 2.4s ease-in-out infinite;
    }

    @keyframes cmtron-rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes cmtron-glow {
      0% {
        filter: drop-shadow(0 0 0 rgba(0, 168, 158, 0.0));
      }
      50% {
        filter: drop-shadow(0 0 12px rgba(0, 168, 158, 0.7));
      }
      100% {
        filter: drop-shadow(0 0 0 rgba(0, 168, 158, 0.0));
      }
    }
  </style>

  <!-- Root group -->
  <g class="cmtron-root">

    <!-- Emblem (simplified circular + molecular motif) -->
    <g class="cmtron-emblem">
      <!-- Outer circle -->
      <circle cx="256" cy="180" r="90" fill="none" />

      <!-- Molecular network (stylized) -->
      <circle cx="230" cy="160" r="10" />
      <circle cx="282" cy="150" r="10" />
      <circle cx="270" cy="200" r="10" />
      <circle cx="220" cy="205" r="10" />

      <line x1="230" y1="160" x2="282" y2="150" stroke="var(--cellmetron-green)" stroke-width="4" />
      <line x1="282" y1="150" x2="270" y2="200" stroke="var(--cellmetron-green)" stroke-width="4" />
      <line x1="270" y1="200" x2="220" y2="205" stroke="var(--cellmetron-green)" stroke-width="4" />
      <line x1="220" y1="205" x2="230" y2="160" stroke="var(--cellmetron-green)" stroke-width="4" />
    </g>

    <!-- Wordmark -->
    <g class="cmtron-wordmark" transform="translate(0, 40)">
      <!-- CELLMETRON -->
      <text
        x="256"
        y="300"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="40"
        letter-spacing="4"
      >
        CELLMETRON
      </text>

      <!-- LONGEVITY -->
      <text
        x="256"
        y="340"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20"
        letter-spacing="8"
      >
        LONGEVITY
      </text>
    </g>

  </g>
</svg>
